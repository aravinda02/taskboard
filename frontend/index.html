<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <style>
    :root { --bg:#f2f4f1; --ink:#1d2a24; --muted:#5f6d66; --line:#cdd5cf; --accent:#2f6b57; --surface:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141a17; --ink:#e6ece8; --muted:#93a39a; --line:#2c3732; --accent:#6fc2a5; --surface:#1b2420; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Iowan Old Style","Palatino Linotype",Georgia,serif; }
    main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem; }
    h1 { font-size: 2.4rem; margin: 0 0 1.5rem; letter-spacing: -0.02em; }
    form { display:flex; gap:.5rem; margin-bottom:1.25rem; }
    input[type=text] { flex:1; padding:.65rem .8rem; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:inherit; font:inherit; }
    button { padding:.65rem 1rem; border:1px solid var(--accent); background:var(--accent); color:var(--bg); border-radius:6px; font:inherit; cursor:pointer; }
    ul { list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:6px; }
    li { display:flex; justify-content:space-between; align-items:center; padding:.7rem .9rem; }
    li + li { border-top:1px solid var(--line); }
    li label { display:flex; gap:.7rem; align-items:center; cursor:pointer; }
    li.done label { color:var(--muted); text-decoration:line-through; }
    li button { background:none; color:var(--muted); border-color:var(--line); padding:.25rem .6rem; font-size:.85rem; }
    input[type=checkbox] { accent-color: var(--accent); width:1.05rem; height:1.05rem; }
    #count { color:var(--muted); margin-top:.9rem; font-size:.9rem; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  </style>
</head>
<body>
  <main>
    <h1>Taskboard</h1>
    <form id="add">
      <input id="title" type="text" placeholder="What needs doing?" aria-label="Task title" maxlength="200" required>
      <button type="submit">Add task</button>
    </form>
    <ul id="tasks"></ul>
    <p id="count"></p>
  </main>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
