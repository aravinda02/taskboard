<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Taskboard</title>
  <style>
    body { font-family: sans-serif; max-width: 30rem; margin: 2rem auto; background: #f2f4f1; color: #1d2a24; }
    h1 { color: #2f6b57; }
    button { background: #2f6b57; color: white; border: none; padding: 0.4rem 0.8rem; cursor: pointer; }
    li { cursor: pointer; padding: 0.25rem 0; }
  </style>
</head>
<body>
  <h1>Taskboard</h1>
  <input id="title" placeholder="New task">
  <button id="add">Add</button>
  <ul id="tasks"></ul>
  <p>Click a task to mark it done.</p>
  <script src="app.js"></script>
</body>
</html>
